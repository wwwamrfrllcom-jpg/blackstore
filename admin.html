<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDn36kqRkTnQ00Pewj1Qneq-obkNk0MQpI",
  authDomain: "blackstore-1ded9.firebaseapp.com",
  databaseURL: "https://blackstore-1ded9-default-rtdb.firebaseio.com",
  projectId: "blackstore-1ded9",
  storageBucket: "blackstore-1ded9.firebasestorage.app",
  messagingSenderId: "581106048422",
  appId: "1:581106048422:web:66a2093156e705ff5d4367",
  measurementId: "G-GWXHPYE9W5"
};
const ADMIN_UID = "E2rt6j7bz2P5upxLwmw789mbPfj2";
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const STORE_KEY = "black_store_data";
function fromFirebase(raw) {
  const data = raw && typeof raw === 'object' ? { ...raw } : {};
  if (!Array.isArray(data.boxes) && Array.isArray(data.products)) {
    data.boxes = data.products.map((p, i) => ({
      id: String(p.id ?? i + 1), name: p.name ?? '', price: String(p.price ?? ''),
      link: p.link ?? '', status: p.status ?? 'available',
      bgImage: p.bgImage ?? p.previewUrl ?? '', password: p.password ?? p.webPassword ?? ''
    }));
  }
  if (!data.name && data.storeName) data.name = data.storeName;
  return data;
}
function toFirebase(raw) {
  const data = raw && typeof raw === 'object' ? { ...raw } : {};
  if (Array.isArray(data.boxes)) data.products = data.boxes.map((p, i) => ({
    id: p.id ?? i + 1, name: p.name ?? '', price: p.price ?? '', link: p.link ?? '',
    status: p.status ?? 'available', previewUrl: p.bgImage ?? p.previewUrl ?? '',
    webPassword: p.password ?? p.webPassword ?? ''
  }));
  if (data.name) data.storeName = data.name;
  return data;
}
let canSync = false, saveTimer;
const overlay = document.createElement('div');
overlay.id = 'bs-firebase-login';
overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#050507;color:white;display:flex;align-items:center;justify-content:center;padding:22px;font-family:Arial,sans-serif;direction:rtl';
overlay.innerHTML = `<form style="width:min(100%,390px);background:#151515;border:1px solid #D4AF37;border-radius:22px;padding:24px;box-sizing:border-box"><h2 style="color:#D4AF37;text-align:center;margin:0 0 10px">BLACK STORE</h2><p style="text-align:center;color:#ccc;font-size:14px">تسجيل دخول الإدارة عبر Firebase</p><label style="display:block;margin:14px 0 6px">الإيميل</label><input id="bs-email" type="email" autocomplete="username" required style="width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #555;background:#090909;color:white"><label style="display:block;margin:14px 0 6px">كلمة السر</label><input id="bs-pass" type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #555;background:#090909;color:white"><button style="width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#D4AF37;color:#111;font-weight:bold">دخول آمن</button><p id="bs-error" style="color:#ff7777;font-size:13px;line-height:1.7"></p></form>`;
document.body.appendChild(overlay);
const errorEl = overlay.querySelector('#bs-error');
overlay.querySelector('form').addEventListener('submit', async (event) => {
  event.preventDefault(); errorEl.textContent = 'جارٍ التحقق...'; const submitBtn = overlay.querySelector('button'); submitBtn.disabled = true; submitBtn.textContent = 'لحظة من فضلك...';
  try {
    const credential = await signInWithEmailAndPassword(auth, overlay.querySelector('#bs-email').value.trim(), overlay.querySelector('#bs-pass').value);
    if (credential.user.uid !== ADMIN_UID) { await signOut(auth); throw new Error('هذا الحساب غير مصرح له بإدارة المتجر.'); }
    errorEl.textContent = '';
  } catch (e) { errorEl.textContent = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' ? 'الإيميل أو كلمة السر غير صحيحة.' : (e.message || 'تعذر تسجيل الدخول.'); } finally { submitBtn.disabled = false; submitBtn.textContent = 'دخول آمن'; }
});
onAuthStateChanged(auth, async (user) => {
  if (!user || user.uid !== ADMIN_UID) { canSync = false; overlay.style.display = 'flex'; if (user && user.uid !== ADMIN_UID) errorEl.textContent = 'تم تسجيل الدخول لكن هذا الحساب غير مصرح له. راجع UID في الكود.'; return; }
  try {
    const snap = await get(ref(db, 'data'));
    if (snap.exists()) {
      localStorage.setItem(STORE_KEY, JSON.stringify(fromFirebase(snap.val())));
      window.dispatchEvent(new Event('black_store_update'));
    } else {
      const local = localStorage.getItem(STORE_KEY);
      if (local) await set(ref(db, 'data'), toFirebase(JSON.parse(local)));
    }
    canSync = true; overlay.style.display = 'none';
  } catch (e) { canSync = false; overlay.style.display = 'flex'; errorEl.textContent = 'تم تسجيل الدخول لكن تعذّر تحميل البيانات: ' + (e.message || 'راجع قواعد Realtime Database.'); console.error(e); }
}, (e) => { canSync = false; overlay.style.display = 'flex'; errorEl.textContent = 'تعذّر التحقق من حالة الدخول: ' + (e.message || e.code || 'خطأ غير معروف'); console.error(e); });
function scheduleSave() {
  if (!canSync) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw && canSync) await set(ref(db, 'data'), toFirebase(JSON.parse(raw))); }
    catch (e) { console.error('BLACK STORE save failed', e); alert('تعذر حفظ التعديلات على الإنترنت. راجع اتصالك وقواعد Firebase.'); }
  }, 350);
}
window.addEventListener('black_store_update', scheduleSave);
window.addEventListener('storage', (event) => { if (event.key === STORE_KEY) scheduleSave(); });
</script>
