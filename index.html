onValue(ref(db, "store"), (snapshot) => {
  const data = snapshot.val();
  if (data && typeof data === "object") {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
      window.dispatchEvent(new Event("black_store_update"));
    } catch (e) { console.error("BLACK STORE sync error", e); }
  }
}, (error) => console.error("BLACK STORE database read failed", error));
</script>

</body>
